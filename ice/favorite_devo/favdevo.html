<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">

        <!-- Add your devotional content here -->
         Add your table and your form here.


          <table>

            <tr>
              <th>Speaker</th>
              <th>Title</th>
              <th>Location</th>
              <th>Year</th>
            </tr>
            <tr>
              <td>Jeffery R Holland</td>
              <td>Nailing Our Colors to the Mast</td>
              <td>Provo</td>
              <td>1985</td>
            </tr>
            <tr>
              <td>Jeffery R Holland</td>
              <td>For Times of Trouble</td>
              <td>Provo</td>
              <td>1980</td>
            </tr>
            <tr>
              <td>Jeffery R Holland</td>
              <td>A Robe, A Ring, and a Fatted Calf</td>
              <td>Provo</td>
              <td>1984</td>
            </tr>
          </table>




        <form>

          <label for="Speaker">Speaker</label>
          <input name="Speaker" id="Speaker" type="text">
          <label for="Title">Title</label>
          <input type="text" id="Title" name="Title">
          <label for="Location">Location</label>
          <input type="text" id="Location" name="Location">
          <label for="Year">Year</label>
          <input type="number" id="Year" name="Year">

        </form>

        
      </div>
    </main>
  </div>
</body>
</html>
